<p-dialog header="Cargar DB" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
  <div class="flex flex-col gap-4" [formGroup]="form">
    <div class="flex flex-col gap-1">
      <label for="zona">Zona</label>
      <p-select
        formControlName="zona"
        id="zona_file"
        [options]="zona_items"
        [fluid]="true"
        placeholder="Seleccionar zona"
        [invalid]="is_invalid('zona')" />
        @if (is_invalid('zona')) {
          <p-message severity="error" size="small" variant="simple">requerido</p-message>
        }
    </div>
    <div class="flex flex-col gap-2 justify-center">
        <p-fileupload
          #fu
          id="file_upload"
          mode="advanced"
          chooseLabel="Eligir archivo ..."
          chooseIcon="pi pi-upload"
          [fileLimit]="1"
          [showCancelButton]="false"
          [showUploadButton]="false"
          accept=".xls,.xlsx"
          (onSelect)="on_upload($event)">
          <ng-template #content let-files let-uploadedFiles="uploadedFiles" let-removeFileCallback="removeFileCallback" let-removeUploadedFileCallback="removeUploadedFileCallback">
              <div class="flex flex-col pt-1">
                @if (files?.length > 0) {
                  @for (file of files; track $index) {
                    <div class="p-1 flex flex-col items-center gap-4">
                        <div><img role="presentation" [alt]="file.name" src="xlsx.png" width="60" /></div>
                        <span class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden">{{ file.name }}</span>
                        <div>{{ formatSize(file.size) }}</div>
                        <p-button icon="pi pi-times" (click)="onRemoveFile($event, removeFileCallback, $index)" [outlined]="true" [rounded]="true" severity="danger" />
                    </div>
                  }
                }
              </div>
          </ng-template>
          <ng-template #file></ng-template>
          <ng-template #empty>
              <div class="flex items-center justify-center flex-col">
                  <i class="pi pi-cloud-upload border-2! rounded-full! p-8! text-4xl! text-muted-color!"></i>
                  <p class="mt-6 mb-0">Arrastra el archivos aquí.</p>
              </div>
          </ng-template>
        </p-fileupload>
        @if (is_invalid('file')) {
          <p-message severity="error" size="small" variant="simple">requerido</p-message>
        }
    </div>
  </div>
  <div class="flex justify-end mt-8">
    <p-button
      label="Envíar"
      severity="secondary"
      (onClick)="on_send_file($event, fu)" />
  </div>
</p-dialog>

<p-toast/>
<p-confirmdialog />
