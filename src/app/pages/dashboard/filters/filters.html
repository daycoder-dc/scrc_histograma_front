<div class="flex flex-col gap-3 pt-3" [formGroup]="form">
  <!-- proyecto -->
  <div class="flex flex-col gap-2">
    <label for="proyectos">Proyectos</label>
    <p-multi-select formControlName="proyectos" [options]="proyectos" placeholder="Seleccionar" [showClear]="true"
      [fluid]="true" />
  </div>

  <!-- Periodo -->
  <div class="flex flex-col gap-2">
    <label for="periodo">Periodo</label>
    <p-multi-select formControlName="periodos" [options]="periodos" placeholder="Seleccionar" [showClear]="true"
      [fluid]="true" />
  </div>

  <!-- Brigadas -->
  <div class="flex flex-col gap-2">
    <label for="brigadas">Brigadas</label>
    <p-multi-select formControlName="brigadas" [options]="brigadas" appendTo="body" placeholder="Seleccionar"
      [showClear]="true" [fluid]="true" />
  </div>

  <!-- Tecnicos -->
  <div class="flex flex-col gap-2">
    <label for="brigadas">Técnicos</label>
    <p-multi-select formControlName="tecnicos" [options]="tecnicos" appendTo="body" placeholder="Seleccionar"
      [showClear]="true" [fluid]="true" />
  </div>

  <!-- Actividad -->
  <div class="flex flex-col gap-2">
    <label for="brigadas">Actividad</label>
    <p-multi-select formControlName="actividad" [options]="actividad" placeholder="Seleccionar" [showClear]="true"
      [fluid]="true" />
  </div>
</div>
